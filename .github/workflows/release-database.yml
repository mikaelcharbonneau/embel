name: Release database

# Applies the pending migrations in supabase/migrations to the production database.
# Manual only. How to set it up and use it: docs/database-release.md.
#
# Inert until the owner adds the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the
# "production" environment: without them the first step fails and nothing else runs. The
# environment's required reviewers approve every run before any step (and any secret) is reached.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the migrations. Leave off for a dry run that only lists what would be applied.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-database
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: fricsfwqibyhemknqgyf
  SUPABASE_CLI: node node_modules/supabase/dist/supabase.js

jobs:
  release:
    name: ${{ inputs.apply && 'Apply migrations to production' || 'Dry run against production' }}
    # Only the main branch ever reaches the production secrets.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Stop unless both secrets exist
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Not set up yet. Add these secrets to the production environment:$missing (docs/database-release.md). Nothing was changed."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Link the production project
        run: $SUPABASE_CLI link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show production's migration history
        run: $SUPABASE_CLI migration list --linked
      - name: Preflight the history
        # The baseline must be recorded as applied, production must not hold migrations this
        # checkout lacks, and every pending migration must be newer than the newest applied one.
        run: |
          set -o pipefail
          $SUPABASE_CLI migration list --linked --output-format json | node scripts/ci/migration-history.mjs release
      - name: Dry run
        run: $SUPABASE_CLI db push --linked --dry-run --skip-vault
      - name: Apply the migrations
        if: ${{ inputs.apply }}
        run: $SUPABASE_CLI db push --linked --skip-vault
      - name: Show production's migration history afterwards
        if: ${{ inputs.apply }}
        run: $SUPABASE_CLI migration list --linked
