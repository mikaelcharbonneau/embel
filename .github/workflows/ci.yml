name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FLUID_RUN_LIVE_TESTS: "0"

jobs:
  quality:
    name: Web quality and production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:setup
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  unit:
    name: Unit and integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Native worker qualification is bound to this exact Node release.
          node-version: "22.22.2"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch pinned native PostgreSQL fixture
        run: >-
          docker --host=unix:///var/run/docker.sock pull
          ghcr.io/supabase/cli/postgres:17.11.0.006-r0@sha256:ee0f2d9747fb9d3c0a29703684ec718f070384ad05bf0d92823ed02cabde8e5a
      - name: Run this shard of the ordinary Vitest suite
        run: >-
          npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=2
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/vitest-${{ matrix.shard }}.xml
      - name: Retain test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vitest-${{ matrix.shard }}
          path: test-results/vitest-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 7

  worker-builds:
    name: Worker bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:shared-worker
      - run: npm run build:logo-worker
      - run: npm run build:api-text-worker

  portable-development:
    name: Portable local services and native worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dev:up
      - run: npm run test:setup
        env:
          EMBEL_TEST_PORTABLE_SQL: "1"
      - run: npm run dev:branding -- --build-only
      - run: npm run dev:doctor
      - run: npm run dev:down
        if: ${{ always() }}

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, unit, worker-builds, portable-development]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      WORKER_RESULT: ${{ needs.worker-builds.result }}
      PORTABLE_RESULT: ${{ needs.portable-development.result }}
    steps:
      - name: Require every check to pass
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$WORKER_RESULT" = success
          test "$PORTABLE_RESULT" = success
